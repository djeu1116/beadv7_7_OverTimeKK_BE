name: Deploy Backend

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: order-service
            port: 8082
          - service: payment-service
            port: 8084
          - service: performance-service
            port: 8083
          - service: user-service
            port: 8081
          - service: gateway-service
            port: 8080
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 조직 정책상 GITHUB_TOKEN의 workflow 쓰기 권한이 잠겨있어서(packages: write 선언해도
          # permission_denied: read_package로 push 거부됨), EC2 pull에 이미 쓰던 개인 PAT로 대체
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
            SERVICE_PORT=${{ matrix.port }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/prgrms-be-adv-devcourse/beadv7_7_overtimekk_be/${{ matrix.service }}:latest
            ghcr.io/prgrms-be-adv-devcourse/beadv7_7_overtimekk_be/${{ matrix.service }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-elasticsearch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # 앱 버전과 무관한 인프라 이미지라 IMAGE_TAG(릴리스 태그) 안 쓰고 latest 고정
      - name: Build and push elasticsearch (nori)
        uses: docker/build-push-action@v6
        with:
          context: deploy/elasticsearch
          file: deploy/elasticsearch/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_overtimekk_be/elasticsearch-nori:latest
          cache-from: type=gha,scope=elasticsearch-nori
          cache-to: type=gha,mode=max,scope=elasticsearch-nori

  deploy:
    needs: [build-and-push, build-and-push-elasticsearch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat <<EOF > .env
          GHCR_OWNER=${{ github.repository_owner }}/beadv7_7_overtimekk_be
          IMAGE_TAG=${{ github.ref_name }}
          FRONTEND_IMAGE=ghcr.io/prgrms-be-adv-devcourse/beadv7_7_overtimekk_fe/frontend:latest
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          ENCRYPTION_SECRET_KEY=${{ secrets.ENCRYPTION_SECRET_KEY }}
          INTERNAL_AUTH_TOKEN=${{ secrets.INTERNAL_AUTH_TOKEN }}
          ORDER_DB_PASSWORD=${{ secrets.ORDER_DB_PASSWORD }}
          PAYMENT_DB_PASSWORD=${{ secrets.PAYMENT_DB_PASSWORD }}
          PERFORMANCE_DB_PASSWORD=${{ secrets.PERFORMANCE_DB_PASSWORD }}
          USER_DB_PASSWORD=${{ secrets.USER_DB_PASSWORD }}
          TOSS_SECRET_KEY=${{ secrets.TOSS_SECRET_KEY }}
          TOSS_CLIENT_KEY=${{ secrets.TOSS_CLIENT_KEY }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MONITORING_PRIVATE_IP=${{ secrets.MONITORING_PRIVATE_IP }}
          EOF

      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/docker-compose.deploy.yml,deploy/nginx,init-databases.sql,init-order.sql,init-payment.sql,.env,observability/promtail"
          target: "/home/ubuntu/reseat-deploy"
          overwrite: true

      - name: Pull and restart containers on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/reseat-deploy
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -p reseat-deploy -f deploy/docker-compose.deploy.yml --env-file .env pull
            docker compose -p reseat-deploy -f deploy/docker-compose.deploy.yml --env-file .env up -d
            docker compose -p reseat-deploy -f deploy/docker-compose.deploy.yml --env-file .env restart nginx
            docker image prune -f
