services:
  # order-service 전용 MySQL 인스턴스(DB 물리 분리 2단계). 다른 mysql-* 컨테이너와 완전히 별개 -
  # 이 컨테이너가 죽어도 다른 서비스는 영향 없음(장애 격리 실측 대상).
  mysql-order:
    image: mysql:8.4
    container_name: kdt-mysql-order
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      TZ: Asia/Seoul
    command:
      - --default-time-zone=+09:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --init-connect=SET NAMES utf8mb4
    volumes:
      - ../init-order.sql:/docker-entrypoint-initdb.d/init-order.sql:ro
      - kdt-mysql-order-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # payment-service 전용 MySQL 인스턴스(DB 물리 분리 2단계).
  mysql-payment:
    image: mysql:8.4
    container_name: kdt-mysql-payment
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      TZ: Asia/Seoul
    command:
      - --default-time-zone=+09:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --init-connect=SET NAMES utf8mb4
    volumes:
      - ../init-payment.sql:/docker-entrypoint-initdb.d/init-payment.sql:ro
      - kdt-mysql-payment-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # performance-service 전용 MySQL 인스턴스(DB 물리 분리 4단계 - 3단계까지는 mysql-order/
  # mysql-payment와 같은 컨테이너를 공유했다가 이번에 완전히 별도 승격됨).
  mysql-performance:
    image: mysql:8.4
    container_name: kdt-mysql-performance
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      TZ: Asia/Seoul
    command:
      - --default-time-zone=+09:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --init-connect=SET NAMES utf8mb4
    volumes:
      - ../init-performance.sql:/docker-entrypoint-initdb.d/init-performance.sql:ro
      - kdt-mysql-performance-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # user-service 전용 MySQL 인스턴스(DB 물리 분리 4단계).
  mysql-user:
    image: mysql:8.4
    container_name: kdt-mysql-user
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      TZ: Asia/Seoul
    command:
      - --default-time-zone=+09:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --init-connect=SET NAMES utf8mb4
    volumes:
      - ../init-user.sql:/docker-entrypoint-initdb.d/init-user.sql:ro
      - kdt-mysql-user-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8
    container_name: kdt-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]   # 재시작해도 대기열/순번 유지
    volumes:
      - kdt-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    build:
      context: ../deploy/elasticsearch   # 배포용 nori Dockerfile 재사용 - 로컬도 같은 이미지로 검증
      dockerfile: Dockerfile
    container_name: kdt-elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - kdt-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    container_name: kdt-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

volumes:
  kdt-mysql-order-data:
  kdt-mysql-payment-data:
  kdt-mysql-performance-data:
  kdt-mysql-user-data:
  kdt-redis-data:
  kdt-es-data:
