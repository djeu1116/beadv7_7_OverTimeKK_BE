spring.application.name=order-service
server.port=8082
spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:mysql://localhost:3306/reseat_order?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=order_service
spring.datasource.password=order-service-dev-pw-change-me
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

user-service.url=http://localhost:8081
order-service.url=http://localhost:8082
payment-service.url=http://localhost:8084
performance-service.url=http://localhost:8083
# order-service는 이제 항상 결제를 원격으로 부른다 - @Profile("payment-api") 구현만 선택 고정
spring.profiles.active=payment-api

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=false

# ShedLock 저장소(멱등키는 payment-service로 이동함). performance-service와 같은 Redis 프로세스 공유하되
# 논리 DB index는 분리(performance-service는 기본 0번 사용) — FLUSHDB 스코프/키 네임스페이스 충돌 방지용.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=1

# 서비스 간 내부 API(/internal/**) 공유 토큰. payment-service와 같은 값이어야 한다.
internal.auth.token=${INTERNAL_AUTH_TOKEN:dev-only-internal-token-change-in-real-deployment}

# user-service JWT 설정
jwt.secret=${JWT_SECRET:dev-only-secret-key-please-change-in-real-deployment-32bytes+}
jwt.expiration-millis=1800000
jwt.refresh-expiration-millis=604800000

logging.level.org.springframework.web=warn
logging.level.org.springframework.data=warn

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces


