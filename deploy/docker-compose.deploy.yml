# EC2 배포용 compose 파일. 로컬 개발용 compose.yaml과는 별개.
# 실행 위치는 repo root(reseat-deploy) 기준: docker compose -f deploy/docker-compose.deploy.yml --env-file .env up -d
# init-databases.sql / observability는 로컬 dev(compose.yaml, observability-compose.yaml)와 공유하므로 이 폴더로 옮기지 않고 ../로 참조함.

services:
  # performance-service, user-service 전용(reseat 스키마). order/payment는 DB 물리 분리 2단계로
  # db-order/db-payment 별도 컨테이너로 승격됨 - 상세: Obsidian db_separation_plan.md
  db:
    image: mysql:8.4
    container_name: reseat-mysql
    mem_limit: 1750m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --default-time-zone=+09:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --init-connect=SET NAMES utf8mb4
    volumes:
      - ../init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - reseat-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - reseat-net
    ports:
      - "127.0.0.1:3306:3306"
    # GUI로DB 확인 가능

  # order-service 전용 MySQL 인스턴스(DB 물리 분리 2단계) - db와 완전히 별개 컨테이너라
  # 한쪽이 죽어도 다른 쪽 서비스에 영향 없음(장애 격리가 이 단계의 핵심).
  db-order:
    image: mysql:8.4
    container_name: reseat-mysql-order
    mem_limit: 512m  # 추정치 - order 스키마만 담당하니 기존 db(1750m)보다 훨씬 작게 잡음, 실측 후 조정 필요
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --default-time-zone=+09:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --init-connect=SET NAMES utf8mb4
    volumes:
      - ../init-order.sql:/docker-entrypoint-initdb.d/init-order.sql:ro
      - reseat-mysql-order-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - reseat-net
    # 호스트 포트 노출 없음 - order-service만 내부 네트워크로 접근

  # payment-service 전용 MySQL 인스턴스(DB 물리 분리 2단계).
  db-payment:
    image: mysql:8.4
    container_name: reseat-mysql-payment
    mem_limit: 512m  # 추정치, 실측 후 조정 필요
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --default-time-zone=+09:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --init-connect=SET NAMES utf8mb4
    volumes:
      - ../init-payment.sql:/docker-entrypoint-initdb.d/init-payment.sql:ro
      - reseat-mysql-payment-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - reseat-net
    # 호스트 포트 노출 없음 - payment-service만 내부 네트워크로 접근

  redis:
    image: redis:8
    container_name: reseat-redis
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - reseat-net
    # user-service의 refresh token 저장용. 호스트로 노출 안 함 - 내부 네트워크로만 접근

  elasticsearch:
    image: ghcr.io/${GHCR_OWNER}/elasticsearch-nori:latest
    container_name: reseat-elasticsearch
    mem_limit: 1g
    environment:
      TZ: Asia/Seoul
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - reseat-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - reseat-net
    # 인증 비활성화 - redis처럼 내부망(reseat-net) 전용, 호스트 포트 노출 안 함

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.2
    container_name: reseat-kibana
    mem_limit: 512m
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - reseat-net
    ports:
      - "127.0.0.1:5601:5601"
    # db처럼 SSH 터널로만 접근 - ES 인증이 없어서 공개 노출 안 함

  user-service:
    image: ghcr.io/${GHCR_OWNER}/user-service:${IMAGE_TAG:-latest}
    container_name: user-service
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/reseat
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://${MONITORING_PRIVATE_IP}:4318/v1/traces
    volumes:
      - ./logs:/app/logs
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - reseat-net
    # 8081은 nginx 프록시용이 아니라 모니터링(EC2#2)의 Prometheus scrape용으로 노출 - SG에서 EC2#2만 허용

  order-service:
    image: ghcr.io/${GHCR_OWNER}/order-service:${IMAGE_TAG:-latest}
    container_name: order-service
    mem_limit: 512m
    depends_on:
      db-order:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      # 결제를 항상 원격(payment-service)으로 부르도록 고정 - order-service는 더 이상 PG/공연 클라이언트를
      # 직접 갖지 않으므로 toss/performance-api 프로필은 필요 없다.
      SPRING_PROFILES_ACTIVE: payment-api
      # DB 물리 분리 2단계 - order-service 전용 MySQL 인스턴스(init-order.sql이 만듦, db-payment/db와 별개)
      SPRING_DATASOURCE_URL: jdbc:mysql://db-order:3306/reseat_order?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: order_service
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ORDER_SERVICE_URL: http://order-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8084
      PERFORMANCE_SERVICE_URL: http://performance-service:8083
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      JWT_SECRET: ${JWT_SECRET}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://${MONITORING_PRIVATE_IP}:4318/v1/traces
    volumes:
      - ./logs:/app/logs
    ports:
      - "8082:8082"
    restart: unless-stopped
    networks:
      - reseat-net
    # 8082는 nginx 프록시용이 아니라 모니터링(EC2#2)의 Prometheus scrape용으로 노출 - SG에서 EC2#2만 허용

  payment-service:
    image: ghcr.io/${GHCR_OWNER}/payment-service:${IMAGE_TAG:-latest}
    container_name: payment-service
    mem_limit: 640m
    depends_on:
      db-payment:
        condition: service_healthy
      redis:
        condition: service_healthy
      order-service:
        condition: service_started
    environment:
      TZ: Asia/Seoul
      # toss/performance-api 프로필이 없으면 @Profile("!toss")/@Profile("!performance-api")인
      # Mock 빈이 이겨서, 운영에서도 조용히 가짜 PG/가짜 공연 조회로 동작하게 된다.
      # order-api는 order-service를 항상 원격으로 부르도록 고정한다.
      SPRING_PROFILES_ACTIVE: toss,performance-api,order-api
      # DB 물리 분리 2단계 - payment-service 전용 MySQL 인스턴스(init-payment.sql이 만듦, db-order/db와 별개)
      SPRING_DATASOURCE_URL: jdbc:mysql://db-payment:3306/reseat_payment?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: payment_service
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ORDER_SERVICE_URL: http://order-service:8082
      PERFORMANCE_SERVICE_URL: http://performance-service:8083
      INTERNAL_AUTH_TOKEN: ${INTERNAL_AUTH_TOKEN}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      JWT_SECRET: ${JWT_SECRET}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://${MONITORING_PRIVATE_IP}:4318/v1/traces
    volumes:
      - ./logs:/app/logs
    ports:
      - "8084:8084"
    restart: unless-stopped
    networks:
      - reseat-net
    # 8084는 nginx 프록시용이 아니라 모니터링(EC2#2)의 Prometheus scrape용으로 노출 - SG에서 EC2#2만 허용

  performance-service:
    image: ghcr.io/${GHCR_OWNER}/performance-service:${IMAGE_TAG:-latest}
    container_name: performance-service
    mem_limit: 1152m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/reseat?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Seoul
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ORDER_SERVICE_URL: http://order-service:8082
      USER_SERVICE_URL: http://user-service:8081
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://${MONITORING_PRIVATE_IP}:4318/v1/traces
    volumes:
      - ./logs:/app/logs
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - reseat-net
    # 8083은 nginx 프록시용이 아니라 모니터링(EC2#2)의 Prometheus scrape용으로 노출 - SG에서 EC2#2만 허용

  gateway-service:
    image: ghcr.io/${GHCR_OWNER}/gateway-service:${IMAGE_TAG:-latest}
    container_name: gateway-service
    mem_limit: 384m
    depends_on:
      - user-service
      - order-service
      - payment-service
      - performance-service
    environment:
      TZ: Asia/Seoul
      USER_SERVICE_URL: http://user-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8084
      PERFORMANCE_SERVICE_URL: http://performance-service:8083
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://${MONITORING_PRIVATE_IP}:4318/v1/traces
    volumes:
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - reseat-net
    # nginx는 호스트 포트 없이 reseat-net 내부에서 gateway-service:8080으로 접근함
    # 8080을 호스트에 노출하는 건 모니터링(EC2#2)의 Prometheus scrape 때문 - SG에서 EC2#2만 허용

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/prgrms-be-adv-devcourse/beadv7_7_overtimekk_fe/frontend:latest}
    container_name: frontend
    mem_limit: 384m
    restart: unless-stopped
    networks:
      - reseat-net
    # 8082/8083처럼 호스트로 노출 안 함 - nginx가 내부 네트워크로만 프록시

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - gateway-service
      - frontend
    restart: unless-stopped
    networks:
      - reseat-net

  certbot:
    image: certbot/certbot
    container_name: certbot
    mem_limit: 32m
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'
    networks:
      - reseat-net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    mem_limit: 64m
    volumes:
      - ../observability/promtail/promtail-config.deploy.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/services:ro
    environment:
      MONITORING_PRIVATE_IP: ${MONITORING_PRIVATE_IP}
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    restart: unless-stopped
    networks:
      - reseat-net
    # 모니터링(EC2#2)의 Loki로 로그 push. 3100 인바운드는 EC2#2 SG에서 EC2#1 SG를 source로 허용해야 함

networks:
  reseat-net:
    driver: bridge

volumes:
  reseat-mysql-data:
  reseat-mysql-order-data:
  reseat-mysql-payment-data:
  reseat-es-data:
