spring.application.name=user-service
server.port=8081

# DB 물리 분리 3단계 - user-service 전용 스키마/계정 (init-databases.sql이 만듦)
spring.datasource.url=jdbc:mysql://localhost:3306/reseat_user?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=user_service
spring.datasource.password=user-service-dev-pw-change-me
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:dev-only-secret-key-please-change-in-real-deployment-32bytes+}
jwt.expiration-millis=1800000
jwt.refresh-expiration-millis=604800000

spring.data.redis.host=localhost
spring.data.redis.port=6379

# common 모듈의 InternalAuthFilter가 컴포넌트 스캔으로 모든 서비스에 등록되는데, 이 서비스는
# /internal/** 엔드포인트가 없어도 빈 생성 시점에 이 값이 필요하다 - 기본값만 있으면 실제로는 안 쓰임.
internal.auth.token=${INTERNAL_AUTH_TOKEN:dev-only-internal-token-change-in-real-deployment}

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.auto-commit=false

login.queue.max-concurrent=8
login.queue.admission-ttl-seconds=60

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:dev-local@example.com}
spring.mail.password=${MAIL_PASSWORD:dev-only-mail-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

email.verification.code-ttl-seconds=300
email.verification.verified-ttl-seconds=1800

logging.level.org.springframework.web=warn
logging.level.org.springframework.data=warn

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces


management.health.mail.enabled=false
