spring.application.name=payment-service
server.port=8084
spring.threads.virtual.enabled=true
# order-service가 항상 이 서비스를 원격으로 호출하는 것과 대칭으로, 이 서비스는 order-service를
# 항상 원격(HTTP)으로 부른다. 프로세스 안 발행(SpringPaymentResultEventPublisher 등)은 더 이상
# 성립하지 않으므로 @Profile("order-api") 구현만 선택되도록 영구 고정한다.
spring.profiles.active=order-api

spring.datasource.url=jdbc:mysql://localhost:3306/reseat?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Seoul&useSSL=false
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

order-service.url=http://localhost:8082
performance-service.url=http://localhost:8083

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=false

# confirm() 멱등키 저장소. performance-service와 같은 Redis 프로세스 공유하되
# 논리 DB index는 분리(performance-service는 기본 0번 사용) — FLUSHDB 스코프/키 네임스페이스 충돌 방지용.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=1

toss.secret-key=${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}
toss.client-key=${TOSS_CLIENT_KEY:test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq}

# 서비스 간 내부 API(/internal/**) 공유 토큰. order-service와 같은 값이어야 한다.
internal.auth.token=${INTERNAL_AUTH_TOKEN:dev-only-internal-token-change-in-real-deployment}

encryption.payment-key-secret=${ENCRYPTION_SECRET_KEY:FeWbkiXN8lIuNMxQvI+Gvxgbky4r1l4I9lt+F3DGG50=}

# user-service JWT 설정 - payment-service는 JWT를 직접 검증하지 않지만(게이트웨이가 이미 처리),
# common.jwt.JwtProvider가 컴포넌트 스캔으로 자동 등록되어 값이 없으면 부팅 자체가 실패한다.
jwt.secret=${JWT_SECRET:dev-only-secret-key-please-change-in-real-deployment-32bytes+}
jwt.expiration-millis=1800000
jwt.refresh-expiration-millis=604800000

logging.level.org.springframework.web=warn
logging.level.org.springframework.data=warn

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
